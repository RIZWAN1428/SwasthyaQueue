<div class="login-page">
  <div class="login-backdrop-glow"></div>
  
  <div class="login-card">
    <a routerLink="/" class="back-link">
      <span>← Back to SwasthyaQueue Overview</span>
    </a>

    <div class="login-header">
      <div class="login-logo-wrap">
        <span class="login-logo">⚡</span>
      </div>
      <h1>Clinical Staff Login</h1>
      <p class="login-subtitle">Authenticate via Spring Security & JWT Filter</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-field">
        <label for="userName">Staff Username</label>
        <input id="userName" type="text" formControlName="userName" placeholder="Enter username (e.g. staff1 / admin)" />
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" placeholder="Enter password" />
      </div>

      <button type="submit" [disabled]="loginForm.invalid" class="btn-primary">
        Sign In to Portal →
      </button>
    </form>

    @if (errorMessage) {
      <div class="error-banner">
        <span>⚠️</span> {{ errorMessage }}
      </div>
    }

    <div class="login-footer-info">
      <span>🛡️ Protected by Stateless JWT Bearer Filter</span>
    </div>
  </div>
</div>
