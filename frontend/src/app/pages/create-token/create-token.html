<div class="create-token-container">
    <h2>Check In Patient</h2>

    <form [formGroup]="tokenForm" (ngSubmit)="OnSubmit()">
        <div class="form-field">
            <label for="departmentId">Department</label>
            <select id="departmentId" formControlName="departmentId">
                <option value="">Select a department</option>
                @for (dept of departments(); track dept.id){
                    <!--[value]="dept.id" — binds the option's actual value to the department's id (a number), not just its displayed text-->
                    <option [value]="dept.id">{{ dept.name }}</option>
                }
            </select>
        </div>

        <div class="form-field">
            <label for="severityScore">Severity (1-5)</label>
            <input id="severityScore" type="number" min="1" max="5" formControlName="severityScore" />
        </div>

        <button type="submit">Check In</button>
    </form>

    @if (errorMessage){
        <p class="error">{{ errorMessage }}</p>
    }
</div>
