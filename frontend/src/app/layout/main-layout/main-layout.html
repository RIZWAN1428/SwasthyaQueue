<header class="app-header">
  <div class="header-brand-wrap">
    <a routerLink="/" class="header-brand" title="View Public Landing">
      <div class="brand-symbol">⚡</div>
      <div class="brand-text">
        <span class="brand-name">SwasthyaQueue</span>
        <span class="brand-sub">PORTAL</span>
      </div>
    </a>
  </div>

  @if (isLoggedIn) {
    <nav class="nav-links">
      <a routerLink="/dashboard" routerLinkActive="active">
        <span class="nav-icon">📊</span> Dashboard
      </a>
      <a routerLink="/departments" routerLinkActive="active">
        <span class="nav-icon">🏢</span> Departments
      </a>
      @if (payload?.role === 'STAFF') {
        <a routerLink="/register-patient" routerLinkActive="active">
          <span class="nav-icon">👤</span> Register Patient
        </a>
      }
      @if (payload?.role === 'ADMIN') {
        <a routerLink="/admin" routerLinkActive="active">
          <span class="nav-icon">⚙️</span> Admin
        </a>
      }
    </nav>

    <div class="header-actions">
      <a routerLink="/" class="btn-public-view" title="View Landing Page">
        <span>🌐 Landing</span>
      </a>
      <div class="user-pill">
        <span class="user-role-dot"></span>
        <span class="user-badge">{{ payload?.role || 'USER' }}</span>
      </div>
      <button class="btn-logout" (click)="logout()">Logout</button>
    </div>
  }
</header>

<main class="app-content">
  <router-outlet></router-outlet>
</main>
