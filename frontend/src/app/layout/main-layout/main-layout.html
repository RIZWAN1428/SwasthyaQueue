<header class="app-header">
  <div class="header-brand-wrap">
    <a routerLink="/" class="header-brand" title="View Institutional Overview">
      <div class="brand-monogram">SQ</div>
      <div class="brand-text">
        <span class="brand-name">SWASTHYAQUEUE</span>
        <span class="brand-sub">OPERATIONAL PORTAL</span>
      </div>
    </a>
  </div>

  @if (isLoggedIn) {
    <nav class="nav-links">
      <a routerLink="/dashboard" routerLinkActive="active">
        <span>Operations Dashboard</span>
      </a>
      <a routerLink="/departments" routerLinkActive="active">
        <span>Departments & Queues</span>
      </a>
      @if (payload?.role === 'STAFF') {
        <a routerLink="/register-patient" routerLinkActive="active">
          <span>Patient Intake</span>
        </a>
      }
      @if (payload?.role === 'ADMIN') {
        <a routerLink="/admin" routerLinkActive="active">
          <span>Administration</span>
        </a>
      }
    </nav>

    <div class="header-actions">
      <!-- Dark/Light Mode Toggle -->
      <button class="theme-toggle-btn" (click)="themeService.toggleTheme()" [title]="'Switch to ' + (themeService.theme() === 'light' ? 'Dark' : 'Light') + ' Mode'">
        @if (themeService.theme() === 'light') {
          <span>🌙 Dark</span>
        } @else {
          <span>☀️ Light</span>
        }
      </button>

      <a routerLink="/" class="btn-public-view">
        <span>Institutional Site</span>
        <span class="arrow">→</span>
      </a>

      <div class="user-pill">
        <span class="user-role-dot"></span>
        <span class="user-badge">{{ payload?.role || 'STAFF' }}</span>
      </div>

      <button class="btn-logout" (click)="logout()">Sign Out</button>
    </div>
  }
</header>

<main class="app-content">
  <router-outlet></router-outlet>
</main>
