name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      
      - name: Run unit tests
        working-directory: backend

        run: | 
          chmod +x mvnw
          ./mvnw -B test -Dtest="*ServiceTest" 
